version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${GP_POSTGRES_USER:-growplan}
      POSTGRES_PASSWORD: ${GP_POSTGRES_PASSWORD:?Set GP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${GP_POSTGRES_DB:-growplan}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GP_POSTGRES_USER:-growplan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${GP_REDIS_PASSWORD:?Set GP_REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${GP_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    build: .
    ports:
      - "8000:8000"
    environment:
      GP_DATABASE_URL: postgresql+psycopg2://${GP_POSTGRES_USER:-growplan}:${GP_POSTGRES_PASSWORD}@postgres:5432/${GP_POSTGRES_DB:-growplan}
      GP_REDIS_URL: redis://:${GP_REDIS_PASSWORD}@redis:6379/0
      GP_API_KEY: ${GP_API_KEY:?Set GP_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  rq-worker:
    build: .
    command: rq worker --url redis://:${GP_REDIS_PASSWORD}@redis:6379/0 default
    environment:
      GP_DATABASE_URL: postgresql+psycopg2://${GP_POSTGRES_USER:-growplan}:${GP_POSTGRES_PASSWORD}@postgres:5432/${GP_POSTGRES_DB:-growplan}
      GP_REDIS_URL: redis://:${GP_REDIS_PASSWORD}@redis:6379/0
      GP_API_KEY: ${GP_API_KEY:?Set GP_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fastapi

volumes:
  pgdata:
